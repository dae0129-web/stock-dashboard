<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台股盤後市場結構觀測</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #f5f4f0;
      --surface:   #ffffff;
      --border:    #e8e4dd;
      --border2:   #d5cfc5;
      --text:      #1a1915;
      --muted:     #7a7568;
      --faint:     #a8a099;
      --up:        #c0392b;
      --down:      #1a6b3a;
      --accent:    #2c5f8a;
      --gold:      #9a6f20;
      --warning:   #a84f1a;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }
    .mono { font-family: 'DM Mono', monospace; }

    /* 細線分隔 */
    .divider { border-color: var(--border); }

    /* 卡片 */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .card-inner {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
    }

    /* 標籤 */
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .tag-breakout   { background: #e8f3ec; color: #1a6b3a; border: 1px solid #b8ddc4; }
    .tag-second     { background: #e8eef5; color: #2c5f8a; border: 1px solid #b8cfe0; }
    .tag-supplement { background: #f5f0e3; color: #9a6f20; border: 1px solid #ddd0a8; }
    .tag-hot        { background: #f5e8e6; color: #c0392b; border: 1px solid #e0b8b4; }
    .tag-weak       { background: #f0ebf5; color: #6b3a8a; border: 1px solid #d0b8e0; }
    .tag-watch      { background: #f0ede8; color: #7a7568; border: 1px solid #d5cfc5; }

    /* 位階 */
    .pos-early    { background: #e8f3ec; color: #1a6b3a; }
    .pos-pullback { background: #e8eef5; color: #2c5f8a; }
    .pos-mid      { background: #f5f0e3; color: #9a6f20; }
    .pos-hot      { background: #f5e8e6; color: #c0392b; }
    .pos-weak     { background: #f0ebf5; color: #6b3a8a; }
    .pos-default  { background: #f0ede8; color: #7a7568; }

    /* 漲跌 */
    .up   { color: var(--up); }
    .down { color: var(--down); }
    .flat { color: var(--muted); }

    /* 評分顏色 */
    .score-high { color: #1a6b3a; }
    .score-mid  { color: #9a6f20; }
    .score-low  { color: #c0392b; }

    /* 強度條 */
    .bar-track {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 1s ease;
    }
    .bar-gold   { background: #c9930a; }
    .bar-green  { background: #1a6b3a; }
    .bar-blue   { background: #2c5f8a; }
    .bar-gray   { background: #c5bfb5; }

    /* 族群狀態顏色 */
    .status-main  { color: #9a6f20; font-weight: 600; }
    .status-flow  { color: #1a6b3a; font-weight: 500; }
    .status-watch { color: #2c5f8a; }
    .status-none  { color: var(--faint); }

    /* 表格 row */
    .trow { border-bottom: 1px solid var(--border); }
    .trow:last-child { border-bottom: none; }
    .trow:hover { background: var(--bg); }

    /* 小動畫 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.4s ease forwards; }

    /* 即時點 */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #1a6b3a;
      animation: blink 2s infinite;
      display: inline-block;
    }

    /* 捲軸 */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* Section 標題 */
    .section-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header style="background:var(--surface); border-bottom:1px solid var(--border);" class="px-6 py-4 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div style="width:32px;height:32px;background:var(--text);border-radius:6px;"
             class="flex items-center justify-center">
          <span style="color:var(--bg);font-size:13px;font-weight:700;">市</span>
        </div>
        <div>
          <div style="font-size:15px;font-weight:700;color:var(--text);">台股盤後市場結構觀測</div>
          <div style="font-size:11px;color:var(--faint);">Market Structure Dashboard</div>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2">
          <span class="live-dot"></span>
          <span style="font-size:12px;color:var(--muted);" id="update-time">載入中...</span>
        </div>
        <span style="font-size:11px;color:var(--faint);" id="trade-date"></span>
      </div>
    </div>
  </header>

  <!-- Summary Strip -->
  <div style="background:var(--surface);border-bottom:1px solid var(--border);" class="px-6 py-2">
    <div class="max-w-6xl mx-auto flex items-center gap-8" style="font-size:12px;">
      <div class="flex items-center gap-2">
        <span style="color:var(--faint);">主流族群</span>
        <span style="color:var(--gold);font-weight:600;" id="top-sector">—</span>
      </div>
      <div class="flex items-center gap-2">
        <span style="color:var(--faint);">強勢股</span>
        <span style="color:var(--down);font-weight:600;" class="mono" id="strong-count">—</span>
      </div>
      <div class="flex items-center gap-2">
        <span style="color:var(--faint);">突破訊號</span>
        <span style="color:var(--accent);font-weight:600;" class="mono" id="breakout-count">—</span>
      </div>
      <div class="flex items-center gap-2">
        <span style="color:var(--faint);">風險警示</span>
        <span style="color:var(--up);font-weight:600;" class="mono" id="risk-count">—</span>
      </div>
    </div>
  </div>

  <!-- Main -->
  <main class="max-w-6xl mx-auto px-6 py-6 space-y-5">

    <!-- 族群排行 -->
    <section class="card p-5 fade-in">
      <div class="section-title">⚡ 主流族群排行</div>
      <div id="sector-list" class="space-y-1"></div>
    </section>

    <!-- 三欄 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
      <section class="card p-5 fade-in">
        <div class="section-title">🚀 平台突破候選</div>
        <div id="breakout-list"></div>
      </section>
      <section class="card p-5 fade-in">
        <div class="section-title">🔄 第二波觀察池</div>
        <div id="second-wave-list"></div>
      </section>
      <section class="card p-5 fade-in">
        <div class="section-title">⚠️ 過熱與風險警示</div>
        <div id="risk-list"></div>
      </section>
    </div>

    <!-- 族群明細 -->
    <section class="card p-5 fade-in">
      <div class="section-title">📊 各族群強勢股明細</div>
      <div id="stock-detail-list" class="space-y-6"></div>
    </section>

  </main>

  <!-- Footer -->
  <footer style="border-top:1px solid var(--border);margin-top:32px;" class="px-6 py-4">
    <div class="max-w-6xl mx-auto text-center" style="font-size:11px;color:var(--faint);">
      本系統為盤後觀測工具，不提供買賣建議，不預測股價。資料來源：twstock / TWSE / TPEx。
    </div>
  </footer>

  <script src="js/dashboard.js"></script>
</body>
</html>
